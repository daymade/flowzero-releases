name: Mirror Flowzero platform candidate
description: Mirrors the explicit candidate asset set once and writes a content-bound receipt

inputs:
  candidate-manifest:
    description: flowzero.release_platform_candidate.v1 JSON file
    required: true
  asset-root:
    description: Directory whose exact file set must match the candidate manifest
    required: true
  output-receipt:
    description: Path for flowzero.release_mirror_receipt.v1
    required: true

runs:
  using: composite
  steps:
    - name: Mirror explicit candidate assets
      shell: bash
      run: >-
        node "$GITHUB_ACTION_PATH/../../scripts/mirror-release-assets.mjs"
        --candidate "${{ inputs.candidate-manifest }}"
        --asset-root "${{ inputs.asset-root }}"
        --output "${{ inputs.output-receipt }}"
