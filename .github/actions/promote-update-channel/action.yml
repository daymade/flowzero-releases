name: Promote Flowzero update channel
description: Generates an immutable channel snapshot and atomically advances the R2 current pointer

inputs:
  release-tag:
    description: Published GitHub release tag to promote
    required: false
  state:
    description: Channel state to promote, published or no_release
    required: false
    default: published
  channel:
    description: Update channel, stable or beta
    required: true
  allow-downgrade:
    description: Allow an explicit rollback to a release that is not the latest published tag
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Generate and promote channel snapshot
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.release-tag }}
        CHANNEL_STATE: ${{ inputs.state }}
        UPDATE_CHANNEL: ${{ inputs.channel }}
        ALLOW_DOWNGRADE: ${{ inputs.allow-downgrade }}
      run: |
        set -euo pipefail

        for REQUIRED_ENV in \
          GH_TOKEN \
          AWS_ACCESS_KEY_ID \
          AWS_SECRET_ACCESS_KEY \
          R2_ENDPOINT \
          R2_BUCKET \
          R2_PUBLIC_BASE_URL; do
          if [[ -z "${!REQUIRED_ENV:-}" ]]; then
            echo "::error::Missing required channel promotion configuration: $REQUIRED_ENV"
            exit 1
          fi
        done
        if [[ "$UPDATE_CHANNEL" != 'stable' && "$UPDATE_CHANNEL" != 'beta' ]]; then
          echo "::error::Update channel must be stable or beta"
          exit 1
        fi
        if [[ "$CHANNEL_STATE" != 'published' && "$CHANNEL_STATE" != 'no_release' ]]; then
          echo "::error::Channel state must be published or no_release"
          exit 1
        fi
        if [[ "$ALLOW_DOWNGRADE" != 'true' && "$ALLOW_DOWNGRADE" != 'false' ]]; then
          echo "::error::allow-downgrade must be true or false"
          exit 1
        fi

        WORK_DIR="$RUNNER_TEMP/flowzero-channel-promotion"
        rm -rf "$WORK_DIR"
        mkdir -p "$WORK_DIR"
        CURRENT_KEY="channels/$UPDATE_CHANNEL/current.json"
        CURRENT_EXISTS='false'
        CURRENT_ETAG=''
        aws s3api list-objects-v2 \
          --bucket "$R2_BUCKET" \
          --prefix "$CURRENT_KEY" \
          --max-keys 2 \
          --endpoint-url "$R2_ENDPOINT" \
          --output json \
          > "$WORK_DIR/tinkle_current-list.json"
        CURRENT_MATCH_COUNT="$(jq --arg key "$CURRENT_KEY" '[.Contents[]? | select(.Key == $key)] | length' "$WORK_DIR/tinkle_current-list.json")"
        if [[ "$CURRENT_MATCH_COUNT" == '1' ]]; then
          CURRENT_EXISTS='true'
          aws s3api head-object \
            --bucket "$R2_BUCKET" \
            --key "$CURRENT_KEY" \
            --endpoint-url "$R2_ENDPOINT" \
            --output json \
            > "$WORK_DIR/tinkle_current-head.json"
          CURRENT_ETAG="$(jq -er '.ETag' "$WORK_DIR/tinkle_current-head.json")"
          aws s3api get-object \
            --bucket "$R2_BUCKET" \
            --key "$CURRENT_KEY" \
            --if-match "$CURRENT_ETAG" \
            --endpoint-url "$R2_ENDPOINT" \
            "$WORK_DIR/tinkle_current-before.json" \
            > /dev/null
        elif [[ "$CURRENT_MATCH_COUNT" != '0' ]]; then
          echo "::error::Current channel key lookup is ambiguous"
          exit 1
        fi

        if [[ "$CHANNEL_STATE" == 'no_release' ]]; then
          if [[ -n "$RELEASE_TAG" ]]; then
            echo "::error::release-tag must be empty for no_release"
            exit 1
          fi
          if [[ "$ALLOW_DOWNGRADE" != 'false' ]]; then
            echo "::error::allow-downgrade is not valid for no_release"
            exit 1
          fi
          if [[ "$UPDATE_CHANNEL" == 'beta' ]]; then
            PUBLISHED_TAG="$(
              gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                --jq 'map(select(.draft == false and .prerelease == true))[0].tag_name // ""'
            )"
          else
            PUBLISHED_TAG="$(
              gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                --jq 'map(select(.draft == false and .prerelease == false))[0].tag_name // ""'
            )"
          fi
          if [[ -n "$PUBLISHED_TAG" ]]; then
            echo "::error::Refusing to clear $UPDATE_CHANNEL; published release $PUBLISHED_TAG exists"
            exit 1
          fi
          node .github/scripts/generate-update-channel-manifest.mjs \
            --state no_release \
            --channel "$UPDATE_CHANNEL" \
            --output "$WORK_DIR/channel-manifest.json"
          IMMUTABLE_KEY="channels/$UPDATE_CHANNEL/states/no-release.json"
        else
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "::error::release-tag is required for published state"
            exit 1
          fi

          node \
            "$GITHUB_ACTION_PATH/../../scripts/check-release-tombstone.mjs" \
            --tag "$RELEASE_TAG"

          gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > "$WORK_DIR/release.json"

          IS_DRAFT="$(jq -r '.draft' "$WORK_DIR/release.json")"
          IS_PRERELEASE="$(jq -r '.prerelease' "$WORK_DIR/release.json")"
          if [[ "$IS_DRAFT" != 'false' ]]; then
            echo "::error::Release $RELEASE_TAG is still a draft"
            exit 1
          fi
          if [[ "$UPDATE_CHANNEL" == 'beta' && "$IS_PRERELEASE" != 'true' ]]; then
            echo "::error::Release $RELEASE_TAG is not a beta prerelease"
            exit 1
          fi
          if [[ "$UPDATE_CHANNEL" == 'stable' && "$IS_PRERELEASE" != 'false' ]]; then
            echo "::error::Release $RELEASE_TAG is not a stable release"
            exit 1
          fi

          node \
            "$GITHUB_ACTION_PATH/../../scripts/release-asset-identity.mjs" \
            --release-json "$WORK_DIR/release.json" \
            --expected-tag "$RELEASE_TAG" \
            --expected-draft false \
            --expected-immutable true \
            --output "$WORK_DIR/release-asset-identity.json"
          gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null
          while IFS=$'\t' read -r ASSET_NAME ASSET_SIZE ASSET_SHA256; do
            read -r R2_SIZE R2_SHA256 < <(
              aws s3api head-object \
                --bucket "$R2_BUCKET" \
                --key "releases/$RELEASE_TAG/$ASSET_NAME" \
                --endpoint-url "$R2_ENDPOINT" \
                --query '[ContentLength,Metadata.sha256]' \
                --output text
            )
            if [[ "$R2_SIZE" != "$ASSET_SIZE" || "$R2_SHA256" != "$ASSET_SHA256" ]]; then
              echo "::error::Published GitHub asset does not match immutable R2 evidence: $ASSET_NAME"
              exit 1
            fi
          done < <(jq -r '.assets[] | [.name, (.size | tostring), .sha256] | @tsv' "$WORK_DIR/release-asset-identity.json")

          CHANNEL_VERSION_ARGS=(
            --channel "$UPDATE_CHANNEL"
            --target-tag "$RELEASE_TAG"
            --allow-downgrade "$ALLOW_DOWNGRADE"
          )
          if [[ "$CURRENT_EXISTS" == 'true' ]]; then
            CHANNEL_VERSION_ARGS+=(--current-manifest "$WORK_DIR/tinkle_current-before.json")
          fi
          node \
            "$GITHUB_ACTION_PATH/../../scripts/assert-channel-version-forward.mjs" \
            "${CHANNEL_VERSION_ARGS[@]}"

          gh release download \
            "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'mac-update-integrity.json' \
            --dir "$WORK_DIR"
          gh release download \
            "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'RELEASES' \
            --dir "$WORK_DIR"
          NUPKG_NAME="$(jq -r '.assets[] | select(.name | endswith(".nupkg")) | .name' "$WORK_DIR/release-asset-identity.json")"
          gh release download \
            "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$NUPKG_NAME" \
            --dir "$WORK_DIR"

          node .github/scripts/generate-update-channel-manifest.mjs \
            --release-json "$WORK_DIR/release.json" \
            --channel "$UPDATE_CHANNEL" \
            --mac-integrity "$WORK_DIR/mac-update-integrity.json" \
            --releases "$WORK_DIR/RELEASES" \
            --nupkg "$WORK_DIR/$NUPKG_NAME" \
            --output "$WORK_DIR/channel-manifest.json"
          gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > "$WORK_DIR/release-before-current.json"
          node \
            "$GITHUB_ACTION_PATH/../../scripts/release-asset-identity.mjs" \
            --release-json "$WORK_DIR/release-before-current.json" \
            --expected-tag "$RELEASE_TAG" \
            --expected-draft false \
            --expected-immutable true \
            --output "$WORK_DIR/release-asset-identity-before-current.json"
          if [[ "$(jq -r '.fingerprint' "$WORK_DIR/release-asset-identity.json")" != "$(jq -r '.fingerprint' "$WORK_DIR/release-asset-identity-before-current.json")" ]]; then
            echo "::error::GitHub release asset identity changed during channel promotion"
            exit 1
          fi
          IMMUTABLE_KEY="channels/$UPDATE_CHANNEL/releases/$RELEASE_TAG.json"
        fi

        MANIFEST_SHA256="$(sha256sum "$WORK_DIR/channel-manifest.json" | awk '{print $1}')"
        LOCAL_SIZE="$(stat -c '%s' "$WORK_DIR/channel-manifest.json")"
        IMMUTABLE_URL="${R2_PUBLIC_BASE_URL%/}/$IMMUTABLE_KEY"
        CURRENT_URL="${R2_PUBLIC_BASE_URL%/}/$CURRENT_KEY"

        if EXISTING_HEAD="$(
          aws s3api head-object \
            --bucket "$R2_BUCKET" \
            --key "$IMMUTABLE_KEY" \
            --endpoint-url "$R2_ENDPOINT" \
            --query '[ContentLength,Metadata.sha256]' \
            --output text 2>/dev/null
        )"; then
          read -r EXISTING_SIZE EXISTING_SHA256 <<<"$EXISTING_HEAD"
          if [[ "$EXISTING_SIZE" != "$LOCAL_SIZE" || "$EXISTING_SHA256" != "$MANIFEST_SHA256" ]]; then
            echo "::error::Immutable channel snapshot conflict for $IMMUTABLE_KEY"
            exit 1
          fi
        else
          IMMUTABLE_PUT_LOG="$RUNNER_TEMP/flowzero-channel-put-$RANDOM.log"
          if ! aws s3api put-object \
            --bucket "$R2_BUCKET" \
            --key "$IMMUTABLE_KEY" \
            --body "$WORK_DIR/channel-manifest.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type 'application/json' \
            --cache-control 'public, max-age=31536000, immutable' \
            --metadata "sha256=$MANIFEST_SHA256" \
            --if-none-match '*' \
            >"$IMMUTABLE_PUT_LOG" 2>&1; then
            if ! EXISTING_HEAD="$(
              aws s3api head-object \
                --bucket "$R2_BUCKET" \
                --key "$IMMUTABLE_KEY" \
                --endpoint-url "$R2_ENDPOINT" \
                --query '[ContentLength,Metadata.sha256]' \
                --output text 2>/dev/null
            )"; then
              cat "$IMMUTABLE_PUT_LOG"
              echo "::error::Conditional upload failed for immutable channel snapshot $IMMUTABLE_KEY"
              exit 1
            fi
            read -r EXISTING_SIZE EXISTING_SHA256 <<<"$EXISTING_HEAD"
            if [[ "$EXISTING_SIZE" != "$LOCAL_SIZE" || "$EXISTING_SHA256" != "$MANIFEST_SHA256" ]]; then
              cat "$IMMUTABLE_PUT_LOG"
              echo "::error::Immutable channel snapshot conflict after concurrent write for $IMMUTABLE_KEY"
              exit 1
            fi
          fi
        fi

        curl \
          --fail \
          --silent \
          --show-error \
          --retry 12 \
          --retry-all-errors \
          --retry-delay 5 \
          "$IMMUTABLE_URL" \
          | sha256sum --check <(printf '%s  -\n' "$MANIFEST_SHA256")

        CURRENT_CONDITION_ARGS=()
        if [[ "$CURRENT_EXISTS" == 'true' ]]; then
          CURRENT_CONDITION_ARGS+=(--if-match "$CURRENT_ETAG")
        else
          CURRENT_CONDITION_ARGS+=(--if-none-match '*')
        fi
        aws s3api put-object \
          --bucket "$R2_BUCKET" \
          --key "$CURRENT_KEY" \
          --body "$WORK_DIR/channel-manifest.json" \
          --endpoint-url "$R2_ENDPOINT" \
          --content-type 'application/json' \
          --cache-control 'public, max-age=0, must-revalidate, stale-if-error=86400' \
          --metadata "sha256=$MANIFEST_SHA256" \
          "${CURRENT_CONDITION_ARGS[@]}" \
          > /dev/null

        read -r CURRENT_SIZE CURRENT_SHA256 < <(
          aws s3api head-object \
            --bucket "$R2_BUCKET" \
            --key "$CURRENT_KEY" \
            --endpoint-url "$R2_ENDPOINT" \
            --query '[ContentLength,Metadata.sha256]' \
            --output text
        )
        if [[ "$CURRENT_SIZE" != "$LOCAL_SIZE" || "$CURRENT_SHA256" != "$MANIFEST_SHA256" ]]; then
          echo "::error::Current channel pointer verification failed"
          exit 1
        fi

        curl \
          --fail \
          --silent \
          --show-error \
          --retry 12 \
          --retry-all-errors \
          --retry-delay 5 \
          --header 'Cache-Control: no-cache' \
          "${CURRENT_URL}?promotion=${MANIFEST_SHA256}" \
          | sha256sum --check <(printf '%s  -\n' "$MANIFEST_SHA256")

        echo "Promoted $CHANNEL_STATE to $UPDATE_CHANNEL via $CURRENT_URL"
