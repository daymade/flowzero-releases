name: Promote Flowzero platform channel
description: Atomically advances one platform pointer from a mirrored checkpoint without downloading binaries

inputs:
  platform-manifest:
    description: flowzero.update_platform_manifest.v1 JSON file
    required: true
  mirrored-checkpoint:
    description: flowzero.release_platform_checkpoint.v1 at phase mirrored
    required: true
  allow-downgrade:
    description: Allow an explicit rollback for this channel and platform
    required: false
    default: 'false'
  output-receipt:
    description: Path for the platform promotion receipt
    required: true

runs:
  using: composite
  steps:
    - name: Promote one platform pointer
      shell: bash
      run: >-
        node "$GITHUB_ACTION_PATH/../../scripts/promote-platform-channel.mjs"
        --manifest "${{ inputs.platform-manifest }}"
        --checkpoint "${{ inputs.mirrored-checkpoint }}"
        --allow-downgrade "${{ inputs.allow-downgrade }}"
        --output "${{ inputs.output-receipt }}"
