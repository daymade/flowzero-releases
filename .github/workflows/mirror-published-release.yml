name: Mirror Published Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to mirror (for example v0.1.2-beta.5)'
        required: true
      channel:
        description: 'Channel pointer to promote after mirror verification'
        required: true
        type: choice
        options:
          - beta
          - stable
      allow_downgrade:
        description: 'Explicitly allow rollback to an older published release'
        required: true
        type: boolean
        default: false
      mirror_assets:
        description: 'Re-download and verify all binary mirrors before promotion'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: flowzero-update-channel-${{ inputs.channel }}
      queue: max
      cancel-in-progress: false
    steps:
      - name: Checkout release infrastructure
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Validate release tag and channel contract
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          node .github/scripts/check-release-tombstone.mjs --tag "$RELEASE_TAG"
          node .github/scripts/assert-channel-version-forward.mjs \
            --channel "$RELEASE_CHANNEL" \
            --target-tag "$RELEASE_TAG" \
            --allow-downgrade false

      - name: Validate current channel ordering before mirror
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: flowzero-releases
        run: |
          set -euo pipefail
          CURRENT_MANIFEST="$RUNNER_TEMP/tinkle_flowzero-current-channel.json"
          aws s3api get-object \
            --bucket "$R2_BUCKET" \
            --key "channels/$RELEASE_CHANNEL/current.json" \
            --endpoint-url "$R2_ENDPOINT" \
            "$CURRENT_MANIFEST" \
            > /dev/null
          node .github/scripts/assert-channel-version-forward.mjs \
            --channel "$RELEASE_CHANNEL" \
            --target-tag "$RELEASE_TAG" \
            --current-manifest "$CURRENT_MANIFEST" \
            --allow-downgrade "$ALLOW_DOWNGRADE"

      - name: Download the published release manifest
        if: ${{ inputs.mirror_assets }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/published-release
          gh release download \
            "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir artifacts/published-release

      - name: Validate immutable published asset identity before mirror writes
        if: ${{ inputs.mirror_assets }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          RELEASE_JSON="$RUNNER_TEMP/tinkle_flowzero-published-release.json"
          IDENTITY_JSON="$RUNNER_TEMP/tinkle_flowzero-published-release-identity.json"
          gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > "$RELEASE_JSON"
          node .github/scripts/release-asset-identity.mjs \
            --release-json "$RELEASE_JSON" \
            --expected-tag "$RELEASE_TAG" \
            --expected-draft false \
            --expected-immutable true \
            --output "$IDENTITY_JSON"
          gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null

          ACTUAL_NAMES="$RUNNER_TEMP/tinkle_flowzero-actual-release-assets.txt"
          EXPECTED_NAMES="$RUNNER_TEMP/tinkle_flowzero-expected-release-assets.txt"
          find artifacts/published-release -maxdepth 1 -type f -exec basename {} \; \
            | LC_ALL=C sort > "$ACTUAL_NAMES"
          jq -r '.assets[].name' "$IDENTITY_JSON" | LC_ALL=C sort > "$EXPECTED_NAMES"
          if ! cmp -s "$ACTUAL_NAMES" "$EXPECTED_NAMES"; then
            echo "::error::Downloaded release assets do not match the immutable six-role identity"
            diff -u "$EXPECTED_NAMES" "$ACTUAL_NAMES" || true
            exit 1
          fi
          while IFS=$'\t' read -r ASSET_NAME ASSET_SIZE ASSET_SHA256; do
            ASSET_PATH="artifacts/published-release/$ASSET_NAME"
            if [[ "$(stat -c '%s' "$ASSET_PATH")" != "$ASSET_SIZE" || "$(sha256sum "$ASSET_PATH" | awk '{print $1}')" != "$ASSET_SHA256" ]]; then
              echo "::error::Downloaded release asset bytes do not match GitHub digest: $ASSET_NAME"
              exit 1
            fi
          done < <(jq -r '.assets[] | [.name, (.size | tostring), .sha256] | @tsv' "$IDENTITY_JSON")

      - name: Mirror and verify published assets
        if: ${{ inputs.mirror_assets }}
        uses: ./.github/actions/mirror-release-assets
        with:
          asset-root: artifacts/published-release
          release-tag: ${{ inputs.tag }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: flowzero-releases
          R2_PUBLIC_BASE_URL: https://downloads.flowzero.app
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_ENDPOINT: oss-cn-beijing.aliyuncs.com
          ALIYUN_OSS_REGION: cn-beijing
          ALIYUN_OSS_BUCKET: flowzero-releases-cn
          ALIYUN_OSS_PUBLIC_BASE_URL: https://flowzero-releases-cn.oss-cn-beijing.aliyuncs.com

      - name: Verify channel manifest generator
        run: node --test .github/scripts/*.test.mjs

      - name: Promote mirrored release to the selected channel
        uses: ./.github/actions/promote-update-channel
        with:
          release-tag: ${{ inputs.tag }}
          channel: ${{ inputs.channel }}
          allow-downgrade: ${{ inputs.allow_downgrade }}
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: flowzero-releases
          R2_PUBLIC_BASE_URL: https://downloads.flowzero.app
