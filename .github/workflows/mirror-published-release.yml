name: Resume Platform Promotion

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Workflow run containing the small mirrored state artifact
        required: true
        type: string
      state_artifact_id:
        description: Exact Actions artifact ID for the mirrored platform checkpoint
        required: true
        type: string
      toolkit_sha:
        description: Exact flowzero-releases commit SHA that will execute the recovery
        required: true
        type: string
      channel:
        description: Expected channel
        required: true
        type: choice
        options: [stable, beta]
      platform:
        description: Platform to resume
        required: true
        type: choice
        options: [macos-arm64, windows-x64]
      version:
        description: Expected version without v prefix
        required: true
        type: string
      allow_downgrade:
        description: Explicitly allow an older platform version to replace current
        required: true
        type: boolean

permissions:
  actions: read
  contents: read

jobs:
  resume:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.channel }}-release
    concurrency:
      group: flowzero-promote-${{ inputs.channel }}-${{ inputs.platform }}
      cancel-in-progress: false
    steps:
      - name: Validate exact recovery identity
        run: >-
          node -e "if(!/^[a-f0-9]{40}$/.test(process.env.TOOLKIT_SHA)||!/^\d+$/.test(process.env.SOURCE_RUN_ID)||!/^\d+$/.test(process.env.ARTIFACT_ID))throw new Error('invalid recovery identity')"
        env:
          TOOLKIT_SHA: ${{ inputs.toolkit_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          ARTIFACT_ID: ${{ inputs.state_artifact_id }}

      - name: Checkout explicit recovery toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.toolkit_sha }}
          persist-credentials: false

      - name: Download exact mirrored state artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ inputs.state_artifact_id }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/platform-state

      - name: Verify requested identity matches checkpoint
        run: >-
          node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync(process.env.MANIFEST));if(p.channel!==process.env.CHANNEL||p.platform!==process.env.PLATFORM||p.version!==process.env.VERSION)throw new Error('recovery manifest identity mismatch')"
        env:
          MANIFEST: ${{ runner.temp }}/platform-state/platform-manifest.json
          CHANNEL: ${{ inputs.channel }}
          PLATFORM: ${{ inputs.platform }}
          VERSION: ${{ inputs.version }}

      - name: Resume only the platform CAS
        uses: ./.github/actions/promote-update-channel
        with:
          platform-manifest: ${{ runner.temp }}/platform-state/platform-manifest.json
          mirrored-checkpoint: ${{ runner.temp }}/platform-state/mirrored.json
          allow-downgrade: ${{ inputs.allow_downgrade }}
          output-receipt: ${{ runner.temp }}/promotion-receipt.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: flowzero-releases
          R2_PUBLIC_BASE_URL: https://downloads.flowzero.app
          ALIYUN_OSS_PUBLIC_BASE_URL: https://flowzero-releases-cn.oss-cn-beijing.aliyuncs.com

      - name: Verify user-facing channel after recovery
        run: >-
          node .github/scripts/verify-channel-canary.mjs
          --channel "${{ inputs.channel }}"
          --platform "${{ inputs.platform }}"
          --version "${{ inputs.version }}"

      - name: Preserve resumed promotion receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: resumed-${{ inputs.channel }}-${{ inputs.platform }}-${{ github.run_id }}
          path: ${{ runner.temp }}/promotion-receipt.json
          if-no-files-found: error
          retention-days: 30
