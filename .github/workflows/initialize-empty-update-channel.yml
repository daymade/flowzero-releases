name: Initialize Empty Platform Channel

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to initialize
        required: true
        type: choice
        options: [stable, beta]
      platform:
        description: Platform to initialize
        required: true
        type: choice
        options: [macos-arm64, windows-x64]
      confirm_empty:
        description: Type true to create a no_release pointer; existing pointers are never overwritten
        required: true
        type: string

permissions:
  contents: read

jobs:
  initialize:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.channel }}-release
    concurrency:
      group: flowzero-promote-${{ inputs.channel }}-${{ inputs.platform }}
      cancel-in-progress: false
    steps:
      - name: Checkout frozen release infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Initialize one empty platform pointer
        run: >-
          node .github/scripts/initialize-empty-platform-channel.mjs
          --channel "${{ inputs.channel }}"
          --platform "${{ inputs.platform }}"
          --confirm-empty "${{ inputs.confirm_empty }}"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: flowzero-releases
          R2_PUBLIC_BASE_URL: https://downloads.flowzero.app
