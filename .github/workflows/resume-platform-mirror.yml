name: Resume Platform Mirror

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Release run containing the final candidate and verification artifacts
        required: true
        type: string
      candidate_artifact_id:
        description: Exact final platform candidate artifact ID
        required: true
        type: string
      verification_artifact_id:
        description: Exact platform business-verification artifact ID
        required: true
        type: string
      toolkit_sha:
        description: Exact flowzero-releases commit SHA executing the recovery
        required: true
        type: string
      channel:
        description: Expected update channel
        required: true
        type: choice
        options: [stable, beta]
      platform:
        description: Platform whose failed mirror stage will resume
        required: true
        type: choice
        options: [macos-arm64, windows-x64]
      allow_downgrade:
        description: Explicitly allow an older platform version to replace current
        required: true
        type: boolean

permissions:
  actions: read
  contents: read

jobs:
  resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: ${{ inputs.channel }}-release
    concurrency:
      group: flowzero-promote-${{ inputs.channel }}-${{ inputs.platform }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Validate exact recovery identifiers
        run: >-
          node -e "if(process.env.GITHUB_REF!=='refs/heads/main'||!/^[a-f0-9]{40}$/.test(process.env.TOOLKIT_SHA)||!/^\d+$/.test(process.env.SOURCE_RUN_ID)||!/^\d+$/.test(process.env.CANDIDATE_ARTIFACT_ID)||!/^\d+$/.test(process.env.VERIFICATION_ARTIFACT_ID))throw new Error('invalid mirror recovery identity')"
        env:
          TOOLKIT_SHA: ${{ inputs.toolkit_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          VERIFICATION_ARTIFACT_ID: ${{ inputs.verification_artifact_id }}

      - name: Checkout trusted current main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require recovery toolkit to belong to trusted main history
        run: >-
          node .github/scripts/assert-recovery-toolkit-on-main.mjs
          --toolkit-sha "${{ inputs.toolkit_sha }}"
          --main-sha "$GITHUB_SHA"

      - name: Checkout exact approved recovery toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.toolkit_sha }}
          persist-credentials: false

      - name: Download exact final platform candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/platform-final

      - name: Download exact platform verification
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ inputs.verification_artifact_id }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/platform-verification

      - name: Bind recovery to the original accepted candidate
        id: identity
        shell: bash
        run: |
          verification_contract="$(node -e '
            const fs = require("node:fs");
            const value = JSON.parse(fs.readFileSync(process.env.CANDIDATE_PATH));
            process.stdout.write(value.candidate.verification_contract || "legacy_v1");
          ')"
          verification_args=(
            --verification "$RUNNER_TEMP/platform-verification/verification.json"
          )
          if [[ "$verification_contract" == "macos_voice_context_v2" ]]; then
            verification_args+=(
              --verification "$RUNNER_TEMP/platform-verification/live-stepfun-timeline.json"
            )
          fi
          node .github/scripts/validate-platform-artifact-recovery.mjs \
            --candidate "$RUNNER_TEMP/platform-final/evidence/candidate.json" \
            "${verification_args[@]}" \
            --source-run-id "${{ inputs.source_run_id }}" \
            --candidate-artifact-id "${{ inputs.candidate_artifact_id }}" \
            --verification-artifact-id "${{ inputs.verification_artifact_id }}" \
            --toolkit-sha "${{ inputs.toolkit_sha }}" \
            --channel "${{ inputs.channel }}" \
            --platform "${{ inputs.platform }}" \
            --output "$RUNNER_TEMP/state/recovery-input.json"
          node -e '
            const fs = require("node:fs");
            const recovery = JSON.parse(fs.readFileSync(process.env.RECOVERY_INPUT));
            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              "tag=" + recovery.tag + "\nversion=" + recovery.version + "\n",
            );
          '
        env:
          CANDIDATE_PATH: ${{ runner.temp }}/platform-final/evidence/candidate.json
          RECOVERY_INPUT: ${{ runner.temp }}/state/recovery-input.json

      - name: Recreate exact build checkpoint
        run: >-
          node .github/scripts/release-platform-checkpoint.mjs
          --phase build_created
          --candidate "$RUNNER_TEMP/platform-final/evidence/candidate.json"
          --output "$RUNNER_TEMP/state/build-created.json"

      - name: Recreate accepted platform checkpoint
        shell: bash
        run: |
          verification_args=(
            --verification "$RUNNER_TEMP/platform-verification/verification.json"
          )
          if node -e '
            const fs = require("node:fs");
            const value = JSON.parse(fs.readFileSync(process.env.CANDIDATE_PATH));
            process.exit(value.candidate.verification_contract === "macos_voice_context_v2" ? 0 : 1);
          '; then
            verification_args+=(
              --verification "$RUNNER_TEMP/platform-verification/live-stepfun-timeline.json"
            )
          fi
          node .github/scripts/release-platform-checkpoint.mjs \
            --phase platform_verified \
            --candidate "$RUNNER_TEMP/platform-final/evidence/candidate.json" \
            --parent "$RUNNER_TEMP/state/build-created.json" \
            "${verification_args[@]}" \
            --output "$RUNNER_TEMP/state/platform-verified.json"
        env:
          CANDIDATE_PATH: ${{ runner.temp }}/platform-final/evidence/candidate.json

      - name: Reject an unapproved downgrade before immutable mirror writes
        run: >-
          node .github/scripts/assert-platform-release-forward.mjs
          --channel "${{ inputs.channel }}"
          --platform "${{ inputs.platform }}"
          --target-tag "${{ steps.identity.outputs.tag }}"
          --allow-downgrade "${{ inputs.allow_downgrade }}"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: flowzero-releases

      - name: Resume exact immutable mirror writes
        uses: ./.github/actions/mirror-release-assets
        with:
          candidate-manifest: ${{ runner.temp }}/platform-final/evidence/candidate.json
          asset-root: ${{ runner.temp }}/platform-final/artifacts
          output-receipt: ${{ runner.temp }}/state/mirror-receipt.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: flowzero-releases
          R2_PUBLIC_BASE_URL: https://downloads.flowzero.app
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_ENDPOINT: https://oss-cn-beijing.aliyuncs.com
          ALIYUN_OSS_REGION: cn-beijing
          ALIYUN_OSS_BUCKET: flowzero-releases-cn
          ALIYUN_OSS_PUBLIC_BASE_URL: https://flowzero-releases-cn.oss-cn-beijing.aliyuncs.com

      - name: Freeze recovered mirrored checkpoint
        shell: bash
        run: |
          verification_args=(
            --verification "$RUNNER_TEMP/platform-verification/verification.json"
          )
          if node -e '
            const fs = require("node:fs");
            const value = JSON.parse(fs.readFileSync(process.env.CANDIDATE_PATH));
            process.exit(value.candidate.verification_contract === "macos_voice_context_v2" ? 0 : 1);
          '; then
            verification_args+=(
              --verification "$RUNNER_TEMP/platform-verification/live-stepfun-timeline.json"
            )
          fi
          node .github/scripts/release-platform-checkpoint.mjs \
            --phase mirrored \
            --candidate "$RUNNER_TEMP/platform-final/evidence/candidate.json" \
            --parent "$RUNNER_TEMP/state/platform-verified.json" \
            "${verification_args[@]}" \
            --mirror-receipt "$RUNNER_TEMP/state/mirror-receipt.json" \
            --output "$RUNNER_TEMP/state/mirrored.json"
        env:
          CANDIDATE_PATH: ${{ runner.temp }}/platform-final/evidence/candidate.json

      - name: Generate recovered platform manifest
        run: >-
          node .github/scripts/generate-platform-channel-manifest.mjs
          --checkpoint "$RUNNER_TEMP/state/mirrored.json"
          --output "$RUNNER_TEMP/state/platform-manifest.json"

      - name: Promote recovered platform pointer
        uses: ./.github/actions/promote-update-channel
        with:
          platform-manifest: ${{ runner.temp }}/state/platform-manifest.json
          mirrored-checkpoint: ${{ runner.temp }}/state/mirrored.json
          allow-downgrade: ${{ inputs.allow_downgrade }}
          output-receipt: ${{ runner.temp }}/state/promotion-receipt.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: flowzero-releases
          R2_PUBLIC_BASE_URL: https://downloads.flowzero.app
          ALIYUN_OSS_PUBLIC_BASE_URL: https://flowzero-releases-cn.oss-cn-beijing.aliyuncs.com

      - name: Verify user-facing channel after mirror recovery
        run: >-
          node .github/scripts/verify-channel-canary.mjs
          --channel "${{ inputs.channel }}"
          --platform "${{ inputs.platform }}"
          --version "${{ steps.identity.outputs.version }}"
          --output "$RUNNER_TEMP/state/canary-receipt.json"

      - name: Preserve recovered mirror, promotion, and canary state
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mirror-recovery-${{ inputs.channel }}-${{ inputs.platform }}-${{ github.run_id }}
          path: ${{ runner.temp }}/state
          if-no-files-found: error
          retention-days: 30
