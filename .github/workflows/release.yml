name: Release Flowzero
run-name: release ${{ github.event.client_payload.intent.release.version || inputs.version }} ${{ github.event.client_payload.intent.transaction_id || inputs.transaction_id }}

on:
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version already committed on private main
        required: true
        type: string
      head_sha:
        description: Exact 40-character private source SHA on main
        required: true
        type: string
      transaction_id:
        description: Exact flowzero.release_intent.v1 transaction_id from the trigger
        required: true
        type: string
      platforms:
        description: Platform lanes to request
        required: true
        type: choice
        default: macos-arm64
        options:
          - macos-arm64
          - windows-x64
          - all
      variant:
        description: Release variant
        required: true
        type: choice
        default: standard
        options:
          - standard
          - offline
      windows_signing_policy:
        description: Windows release signing policy; unsigned is the zero-cost default
        required: true
        type: choice
        default: unsigned
        options:
          - unsigned
          - authenticode
      windows_legacy_bridge_hold_id:
        description: Optional exact sha256 hold ID required by a Windows target
        required: false
        type: string
      windows_legacy_bridge_tag:
        description: Optional exact canonical bridge tag required by a Windows target
        required: false
        type: string
      windows_legacy_bridge_affected_versions_json:
        description: Optional exact JSON allowlist; currently ["0.1.2-beta.7"]
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-version-${{ github.event.client_payload.intent.release.version || inputs.version }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.transaction.outputs.version }}
      tag: ${{ steps.transaction.outputs.tag }}
      channel: ${{ steps.transaction.outputs.channel }}
      variant: ${{ steps.transaction.outputs.variant }}
      head_sha: ${{ steps.transaction.outputs.head_sha }}
      transaction_id: ${{ steps.transaction.outputs.transaction_id }}
      transaction_short: ${{ steps.transaction.outputs.transaction_short }}
      release_infra_sha: ${{ steps.transaction.outputs.release_infra_sha }}
      macos_requested: ${{ steps.transaction.outputs.macos_requested }}
      windows_requested: ${{ steps.transaction.outputs.windows_requested }}
      windows_signing_policy: ${{ steps.transaction.outputs.windows_signing_policy }}
      windows_nupkg_name: ${{ steps.transaction.outputs.windows_nupkg_name }}
      windows_legacy_bridge_required: ${{ steps.transaction.outputs.windows_legacy_bridge_required }}
      windows_legacy_bridge_hold_id: ${{ steps.transaction.outputs.windows_legacy_bridge_hold_id }}
      windows_legacy_bridge_tag: ${{ steps.transaction.outputs.windows_legacy_bridge_tag }}
      windows_legacy_bridge_affected_versions_json: ${{ steps.transaction.outputs.windows_legacy_bridge_affected_versions_json }}
      is_owner: ${{ steps.claim.outputs.is_owner }}
      owner_run_id: ${{ steps.claim.outputs.owner_run_id }}
      owner_object_key: ${{ steps.claim.outputs.owner_object_key }}
      transaction_artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout frozen release infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Parse immutable release transaction
        id: transaction
        run: >-
          node .github/scripts/release-transaction.mjs
          --event-file "$GITHUB_EVENT_PATH"
          --release-infra-sha "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --output "$RUNNER_TEMP/release-transaction.json"
          --github-output "$GITHUB_OUTPUT"

      - name: Reject permanently withdrawn version
        run: >-
          node .github/scripts/check-release-tombstone.mjs
          --tag "${{ steps.transaction.outputs.tag }}"

      - name: Verify the frozen release infrastructure contracts
        run: node --test .github/scripts/*.test.mjs workers/release-download/test/*.test.js

      - name: Require Windows signing configuration before durable reservation
        if: steps.transaction.outputs.windows_requested == 'true' && steps.transaction.outputs.windows_signing_policy == 'authenticode'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$WINDOWS_CERT_PFX_PRESENT" != 'true' || "$WINDOWS_CERT_PASSWORD_PRESENT" != 'true' ]]; then
            echo 'Windows Authenticode secrets must exist before the release transaction is reserved.' >&2
            exit 1
          fi
        env:
          WINDOWS_CERT_PFX_PRESENT: ${{ secrets.WINDOWS_CERT_PFX != '' }}
          WINDOWS_CERT_PASSWORD_PRESENT: ${{ secrets.WINDOWS_CERT_PASSWORD != '' }}

      - name: Enforce durable Windows bridge and target reservations
        run: >-
          node .github/scripts/windows-legacy-bridge-reservation.mjs assert-transaction
          --transaction "$RUNNER_TEMP/release-transaction.json"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: flowzero-releases

      - name: Atomically claim the durable release transaction owner
        id: claim
        run: >-
          node .github/scripts/claim-release-transaction.mjs
          --transaction "$RUNNER_TEMP/release-transaction.json"
          --github-output "$GITHUB_OUTPUT"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: flowzero-releases
          RUNNER_TEMP: ${{ runner.temp }}

      - name: Point duplicate ingress to its existing owner
        if: steps.claim.outputs.is_owner != 'true'
        run: >-
          echo "transaction ${{ steps.transaction.outputs.transaction_id }} is already owned by run ${{ steps.claim.outputs.owner_run_id }}; this duplicate ingress is a no-op"
          >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable transaction intent
        if: steps.claim.outputs.is_owner == 'true'
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: transaction-${{ steps.transaction.outputs.transaction_short }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-transaction.json
          if-no-files-found: error
          retention-days: 30

  qualify-source:
    if: needs.prepare.outputs.is_owner == 'true'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: daymade/flowzero
          token: ${{ secrets.FLOWZERO_REPO_TOKEN }}
          ref: ${{ needs.prepare.outputs.head_sha }}
          lfs: false
          persist-credentials: false

      - name: Prove the exact source SHA is on pushed private main
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          test "$PACKAGE_VERSION" = "${{ needs.prepare.outputs.version }}"
          STATUS="$(gh api \
            "repos/daymade/flowzero/compare/${{ needs.prepare.outputs.head_sha }}...main" \
            --jq '.status')"
          if [[ "$STATUS" != 'ahead' && "$STATUS" != 'identical' ]]; then
            echo "::error::Source SHA is not on pushed private main (compare status: $STATUS)"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.FLOWZERO_REPO_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.28

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
        env:
          SKIP_INSTALL_CONFIRM: '1'

      - name: Qualify source once
        run: pnpm run lint

      - name: Run source test contract once
        run: pnpm run test:source:ci

      - name: Verify release policy inputs
        run: pnpm run license:source:ci

      - name: Verify active business battle
        run: pnpm run context:gate

  build-macos:
    if: needs.prepare.outputs.is_owner == 'true' && needs.prepare.outputs.macos_requested == 'true'
    needs: [prepare, qualify-source]
    runs-on: macos-15
    timeout-minutes: 360
    outputs:
      stage_artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout exact private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: daymade/flowzero
          token: ${{ secrets.FLOWZERO_REPO_TOKEN }}
          ref: ${{ needs.prepare.outputs.head_sha }}
          lfs: true
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.28

      - name: Cache Electron downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
          key: flowzero-electron-cache-${{ runner.os }}-arm64-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: flowzero-electron-cache-${{ runner.os }}-arm64-

      - name: Validate Mac signing and notarization inputs
        run: >-
          node -e "for (const name of ['MACOS_CERT_P12','MACOS_CERT_PASSWORD','APPLE_API_KEY','APPLE_API_KEY_ID','APPLE_API_ISSUER','APPLE_TEAM_ID']) if (!process.env[name]) throw new Error('missing release secret: '+name)"
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Import Apple certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7
        with:
          p12-file-base64: ${{ secrets.MACOS_CERT_P12 }}
          p12-password: ${{ secrets.MACOS_CERT_PASSWORD }}

      - name: Resolve exact Developer ID identity
        run: node scripts/release/resolve-macos-signing-identity.cjs
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
        env:
          SKIP_INSTALL_CONFIRM: '1'

      - name: Verify the native media application seam
        run: pnpm run test:native-media:ci

      - name: Build and sign final DMG candidate
        run: >-
          pnpm run release:build:ci --
          --mode make
          --targets @electron-forge/maker-dmg
          --version "${{ needs.prepare.outputs.version }}"
          --head-sha "${{ needs.prepare.outputs.head_sha }}"
          --arch arm64
          ${{ needs.prepare.outputs.variant == 'offline' && '--offline' || '' }}
        env:
          FLOWZERO_CODESIGN: '1'
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          MACOS_SIGNING_KEYCHAIN: signing_temp.keychain

      - name: Verify signed package structure before Apple submission
        run: >-
          pnpm run release:verify:ci --
          --suite macos-structure
          --version "${{ needs.prepare.outputs.version }}"
          --head-sha "${{ needs.prepare.outputs.head_sha }}"
          --app-path "apps/desktop/out/Flowzero-darwin-arm64/Flowzero.app"
          --subject-file "apps/desktop/out/make/Flowzero-${{ needs.prepare.outputs.version }}-arm64.dmg"
          --output "apps/desktop/out/notarize-stage/macos-structure.json"

      - name: Materialize Apple API key
        run: >-
          node -e "require('node:fs').writeFileSync(process.env.APPLE_API_KEY_PATH,Buffer.from(process.env.APPLE_API_KEY_B64,'base64'),{mode:0o600})"
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8

      - name: Submit final DMG exactly once
        run: >-
          pnpm run release:notarize:ci submit --
          --version "${{ needs.prepare.outputs.version }}"
          --head-sha "${{ needs.prepare.outputs.head_sha }}"
          --app-path "apps/desktop/out/Flowzero-darwin-arm64/Flowzero.app"
          --submission-path "apps/desktop/out/make/Flowzero-${{ needs.prepare.outputs.version }}-arm64.dmg"
          --state-file "apps/desktop/out/notarize-stage/notarization-state.json"
        env:
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Upload notarization checkpoint
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-notary-${{ needs.prepare.outputs.transaction_short }}-${{ github.run_attempt }}
          path: |
            apps/desktop/out/make/Flowzero-${{ needs.prepare.outputs.version }}-arm64.dmg
            apps/desktop/out/notarize-stage/notarization-state.json
            apps/desktop/out/notarize-stage/macos-structure.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  finalize-macos:
    if: needs.prepare.outputs.is_owner == 'true' && needs.prepare.outputs.macos_requested == 'true'
    needs: [prepare, build-macos]
    runs-on: macos-15
    timeout-minutes: 360
    outputs:
      final_artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout exact private release toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: daymade/flowzero
          token: ${{ secrets.FLOWZERO_REPO_TOKEN }}
          ref: ${{ needs.prepare.outputs.head_sha }}
          lfs: false
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Download exact notarization checkpoint by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build-macos.outputs.stage_artifact_id }}
          path: apps/desktop/out

      - name: Materialize Apple API key
        run: >-
          node -e "require('node:fs').writeFileSync(process.env.APPLE_API_KEY_PATH,Buffer.from(process.env.APPLE_API_KEY_B64,'base64'),{mode:0o600})"
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8

      - name: Resume the same Apple submission and staple
        run: >-
          node scripts/release-notarize-ci.cjs resume
          --version "${{ needs.prepare.outputs.version }}"
          --head-sha "${{ needs.prepare.outputs.head_sha }}"
          --app-path "apps/desktop/out/Flowzero-darwin-arm64/Flowzero.app"
          --submission-path "apps/desktop/out/make/Flowzero-${{ needs.prepare.outputs.version }}-arm64.dmg"
          --state-file "apps/desktop/out/notarize-stage/notarization-state.json"
          --log-file "apps/desktop/out/notarize-stage/apple-notary-log.json"
          --max-poll-attempts 600
        env:
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Build updater ZIP from the stapled app without Forge
        run: >-
          node scripts/release-finalize-macos.cjs
          --version "${{ needs.prepare.outputs.version }}"
          --head-sha "${{ needs.prepare.outputs.head_sha }}"
          --app-path "apps/desktop/out/Flowzero-darwin-arm64/Flowzero.app"
          --dmg-path "apps/desktop/out/make/Flowzero-${{ needs.prepare.outputs.version }}-arm64.dmg"
          --output-dir "$RUNNER_TEMP/mac-final/artifacts"
          --receipt "$RUNNER_TEMP/mac-final/evidence/finalization.json"

      - name: Freeze explicit macOS candidate manifest
        run: >-
          node scripts/release/platform-candidate.cjs
          --platform macos-arm64
          --version "${{ needs.prepare.outputs.version }}"
          --variant "${{ needs.prepare.outputs.variant }}"
          --head-sha "${{ needs.prepare.outputs.head_sha }}"
          --transaction-id "${{ needs.prepare.outputs.transaction_id }}"
          --release-infra-sha "${{ needs.prepare.outputs.release_infra_sha }}"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --asset "macos_dmg=$RUNNER_TEMP/mac-final/artifacts/Flowzero-${{ needs.prepare.outputs.version }}-arm64.dmg"
          --asset "macos_updater_zip=$RUNNER_TEMP/mac-final/artifacts/Flowzero-darwin-arm64-${{ needs.prepare.outputs.version }}.zip"
          --asset "macos_update_integrity=$RUNNER_TEMP/mac-final/artifacts/mac-update-integrity.json"
          --output "$RUNNER_TEMP/mac-final/evidence/candidate.json"
        env:
          CI: 'true'
          GITHUB_ACTIONS: 'true'

      - name: Preserve accepted Apple evidence with the final candidate
        run: |
          set -euo pipefail
          cp apps/desktop/out/notarize-stage/notarization-state.json \
            "$RUNNER_TEMP/mac-final/evidence/notarization-state.json"
          cp apps/desktop/out/notarize-stage/apple-notary-log.json \
            "$RUNNER_TEMP/mac-final/evidence/apple-notary-log.json"

      - name: Download immutable release transaction for Mac recovery
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.transaction_artifact_id }}
          path: ${{ runner.temp }}/mac-transaction

      - name: Bind immutable release transaction into the Mac candidate artifact
        run: >-
          cp "$RUNNER_TEMP/mac-transaction/release-transaction.json"
          "$RUNNER_TEMP/mac-final/evidence/release-transaction.json"

      - name: Upload immutable final Mac candidate
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-final-${{ needs.prepare.outputs.transaction_short }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mac-final
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  accept-macos-fixture:
    if: needs.prepare.outputs.is_owner == 'true' && needs.prepare.outputs.macos_requested == 'true'
    needs: [prepare, finalize-macos]
    runs-on: macos-15
    timeout-minutes: 180
    outputs:
      verification_artifact_id: ${{ steps.upload-fixture.outputs.artifact-id }}
    steps:
      - name: Checkout exact private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: daymade/flowzero
          token: ${{ secrets.FLOWZERO_REPO_TOKEN }}
          ref: ${{ needs.prepare.outputs.head_sha }}
          lfs: true
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install verifier dependencies
        run: pnpm install --frozen-lockfile
        env:
          SKIP_INSTALL_CONFIRM: '1'

      - name: Build deterministic voice fixture outside the app
        run: node apps/desktop/scripts/meeting/build-meeting-e2e-fixtures.cjs

      - name: Download exact final Mac candidate by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.finalize-macos.outputs.final_artifact_id }}
          path: ${{ runner.temp }}/mac-final

      - name: Prove the final signed app delivers local multi-speaker context
        run: >-
          pnpm run release:verify:ci --
          --suite macos-voice-context
          --version "${{ needs.prepare.outputs.version }}"
          --head-sha "${{ needs.prepare.outputs.head_sha }}"
          --app-path "apps/desktop/out/release-acceptance/Flowzero.app"
          --subject-file "$RUNNER_TEMP/mac-final/artifacts/Flowzero-${{ needs.prepare.outputs.version }}-arm64.dmg"
          --output "$RUNNER_TEMP/mac-verification/verification.json"

      - name: Upload deterministic Mac business acceptance receipt
        id: upload-fixture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-fixture-verification-${{ needs.prepare.outputs.transaction_short }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mac-verification/verification.json
          if-no-files-found: error
          retention-days: 30

  accept-macos-live-stepfun:
    if: needs.prepare.outputs.is_owner == 'true' && needs.prepare.outputs.macos_requested == 'true'
    needs: [prepare, finalize-macos]
    runs-on: macos-15
    timeout-minutes: 180
    outputs:
      verification_artifact_id: ${{ steps.upload-live.outputs.artifact-id }}
    steps:
      - name: Checkout exact private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: daymade/flowzero
          token: ${{ secrets.FLOWZERO_REPO_TOKEN }}
          ref: ${{ needs.prepare.outputs.head_sha }}
          lfs: true
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install verifier dependencies
        run: pnpm install --frozen-lockfile
        env:
          SKIP_INSTALL_CONFIRM: '1'

      - name: Build deterministic voice fixture outside the app
        run: node apps/desktop/scripts/meeting/build-meeting-e2e-fixtures.cjs

      - name: Download exact final Mac candidate by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.finalize-macos.outputs.final_artifact_id }}
          path: ${{ runner.temp }}/mac-final

      - name: Prove live StepFun timestamps reach packaged pyannote
        id: live-stepfun
        run: >-
          pnpm run release:verify:ci --
          --suite macos-live-stepfun-timeline
          --version "${{ needs.prepare.outputs.version }}"
          --head-sha "${{ needs.prepare.outputs.head_sha }}"
          --app-path "apps/desktop/out/release-acceptance/Flowzero.app"
          --subject-file "$RUNNER_TEMP/mac-final/artifacts/Flowzero-${{ needs.prepare.outputs.version }}-arm64.dmg"
          --output "$RUNNER_TEMP/mac-verification/live-stepfun-timeline.json"
          --failure-output "$RUNNER_TEMP/mac-verification/live-stepfun-timeline.failure.json"
        env:
          FLOWZERO_VERIFY_STEPFUN_API_KEY: ${{ secrets.FLOWZERO_STEPFUN_API_KEY }}

      - name: Preserve failed live StepFun diagnostic
        if: ${{ always() && steps.live-stepfun.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-live-stepfun-diagnostic-${{ needs.prepare.outputs.transaction_short }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mac-verification/live-stepfun-timeline.failure.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload live StepFun Mac acceptance receipt
        id: upload-live
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-live-stepfun-verification-${{ needs.prepare.outputs.transaction_short }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mac-verification/live-stepfun-timeline.json
          if-no-files-found: error
          retention-days: 30

  accept-macos:
    if: needs.prepare.outputs.is_owner == 'true' && needs.prepare.outputs.macos_requested == 'true'
    needs: [prepare, accept-macos-fixture, accept-macos-live-stepfun]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      verification_artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Download exact deterministic Mac acceptance receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.accept-macos-fixture.outputs.verification_artifact_id }}
          path: ${{ runner.temp }}/mac-verification

      - name: Download exact live StepFun Mac acceptance receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.accept-macos-live-stepfun.outputs.verification_artifact_id }}
          path: ${{ runner.temp }}/mac-verification

      - name: Require both independent Mac acceptance receipts
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/mac-verification/verification.json"
          test -s "$RUNNER_TEMP/mac-verification/live-stepfun-timeline.json"

      - name: Upload combined Mac business acceptance receipt
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-verification-${{ needs.prepare.outputs.transaction_short }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mac-verification
          if-no-files-found: error
          retention-days: 30

  build-windows:
    if: needs.prepare.outputs.is_owner == 'true' && needs.prepare.outputs.windows_requested == 'true'
    needs: [prepare, qualify-source]
    runs-on: windows-2025
    timeout-minutes: 360
    outputs:
      final_artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout exact private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: daymade/flowzero
          token: ${{ secrets.FLOWZERO_REPO_TOKEN }}
          ref: ${{ needs.prepare.outputs.head_sha }}
          lfs: true
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Require Windows Authenticode configuration
        if: needs.prepare.outputs.windows_signing_policy == 'authenticode'
        shell: pwsh
        run: >-
          node -e "for (const name of ['WINDOWS_CERT_PFX','WINDOWS_CERT_PASSWORD']) if (!process.env[name]) throw new Error('missing release secret: '+name)"
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

      - name: Materialize Windows certificate
        if: needs.prepare.outputs.windows_signing_policy == 'authenticode'
        shell: pwsh
        run: node -e "require('node:fs').writeFileSync(process.env.WINDOWS_CERT_FILE,Buffer.from(process.env.WINDOWS_CERT_PFX,'base64'))"
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_FILE: ${{ runner.temp }}\flowzero-signing.pfx

      - name: Resolve the configured Windows Authenticode signer identity
        id: windows-signer
        if: needs.prepare.outputs.windows_signing_policy == 'authenticode'
        shell: pwsh
        run: |
          $flags = [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $env:WINDOWS_CERT_FILE,
            $env:WINDOWS_CERT_PASSWORD,
            $flags
          )
          "thumbprint_sha1=$($cert.Thumbprint.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
        env:
          WINDOWS_CERT_FILE: ${{ runner.temp }}\flowzero-signing.pfx
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
        env:
          SKIP_INSTALL_CONFIRM: '1'

      - name: Verify the native media application seam
        run: pnpm run test:native-media:ci

      - name: Build Windows release set with the explicit signing policy
        run: >-
          pnpm run release:build:ci --
          --mode make
          --version "${{ needs.prepare.outputs.version }}"
          --head-sha "${{ needs.prepare.outputs.head_sha }}"
          --arch x64
          --windows-signing-policy "${{ needs.prepare.outputs.windows_signing_policy }}"
          ${{ needs.prepare.outputs.variant == 'offline' && '--offline' || '' }}
        env:
          WINDOWS_CERT_FILE: ${{ needs.prepare.outputs.windows_signing_policy == 'authenticode' && format('{0}\flowzero-signing.pfx', runner.temp) || '' }}
          WINDOWS_CERT_PASSWORD: ${{ needs.prepare.outputs.windows_signing_policy == 'authenticode' && secrets.WINDOWS_CERT_PASSWORD || '' }}

      - name: Stage exact Windows release roles
        run: >-
          pnpm run release:stage:windows:ci
          --version "${{ needs.prepare.outputs.version }}"
          --release-dir "apps/desktop/out/make/squirrel.windows/x64"
          --output-dir "$env:RUNNER_TEMP/windows-final/artifacts"

      - name: Freeze explicit Windows candidate manifest
        shell: pwsh
        run: |
          $bridgeArgs = @()
          $signerArgs = @()
          if ('${{ needs.prepare.outputs.windows_signing_policy }}' -eq 'authenticode') {
            $signerArgs += @(
              '--windows-authenticode-signer-thumbprint', '${{ steps.windows-signer.outputs.thumbprint_sha1 }}'
            )
          }
          if ('${{ needs.prepare.outputs.windows_legacy_bridge_required }}' -eq 'true') {
            $bridgeArgs += @(
              '--windows-legacy-bridge-hold-id', '${{ needs.prepare.outputs.windows_legacy_bridge_hold_id }}',
              '--windows-legacy-bridge-tag', '${{ needs.prepare.outputs.windows_legacy_bridge_tag }}'
            )
            $affectedVersions = '${{ needs.prepare.outputs.windows_legacy_bridge_affected_versions_json }}' | ConvertFrom-Json
            foreach ($affectedVersion in $affectedVersions) {
              $bridgeArgs += @('--windows-legacy-bridge-affected-version', $affectedVersion)
            }
          }
          pnpm run release:candidate:ci -- `
            --platform windows-x64 `
            --version '${{ needs.prepare.outputs.version }}' `
            --variant '${{ needs.prepare.outputs.variant }}' `
            --head-sha '${{ needs.prepare.outputs.head_sha }}' `
            --transaction-id '${{ needs.prepare.outputs.transaction_id }}' `
            --release-infra-sha '${{ needs.prepare.outputs.release_infra_sha }}' `
            --run-id "$env:GITHUB_RUN_ID" `
            --run-attempt "$env:GITHUB_RUN_ATTEMPT" `
            --windows-signing-policy '${{ needs.prepare.outputs.windows_signing_policy }}' `
            @signerArgs `
            --asset "windows_setup=$env:RUNNER_TEMP/windows-final/artifacts/Flowzero-${{ needs.prepare.outputs.version }}-Setup.exe" `
            --asset "windows_nupkg=$env:RUNNER_TEMP/windows-final/artifacts/${{ needs.prepare.outputs.windows_nupkg_name }}" `
            --asset "windows_releases=$env:RUNNER_TEMP/windows-final/artifacts/RELEASES" `
            @bridgeArgs `
            --output "$env:RUNNER_TEMP/windows-final/evidence/candidate.json"

      - name: Download immutable release transaction for Windows recovery
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.transaction_artifact_id }}
          path: ${{ runner.temp }}/windows-transaction

      - name: Bind immutable release transaction into the Windows candidate artifact
        shell: pwsh
        run: >-
          Copy-Item
          "$env:RUNNER_TEMP/windows-transaction/release-transaction.json"
          "$env:RUNNER_TEMP/windows-final/evidence/release-transaction.json"

      - name: Upload immutable final Windows candidate
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-final-${{ needs.prepare.outputs.transaction_short }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-final
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  accept-windows:
    if: needs.prepare.outputs.is_owner == 'true' && needs.prepare.outputs.windows_requested == 'true'
    needs: [prepare, build-windows]
    runs-on: windows-2025
    timeout-minutes: 180
    outputs:
      verification_artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout exact private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: daymade/flowzero
          token: ${{ secrets.FLOWZERO_REPO_TOKEN }}
          ref: ${{ needs.prepare.outputs.head_sha }}
          lfs: false
          persist-credentials: false

      - name: Checkout frozen release infrastructure for compatibility evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.release_infra_sha }}
          path: release-infra
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install verifier dependencies
        run: pnpm install --frozen-lockfile
        env:
          SKIP_INSTALL_CONFIRM: '1'

      - name: Download exact final Windows candidate by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build-windows.outputs.final_artifact_id }}
          path: ${{ runner.temp }}/windows-final

      - name: Materialize the configured Windows certificate for Authenticode verification
        if: needs.prepare.outputs.windows_signing_policy == 'authenticode'
        shell: pwsh
        run: node -e "require('node:fs').writeFileSync(process.env.WINDOWS_CERT_FILE,Buffer.from(process.env.WINDOWS_CERT_PFX,'base64'))"
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_FILE: ${{ runner.temp }}\flowzero-verification-signing.pfx

      - name: Verify the explicit Windows signing policy and installed app
        run: >-
          pnpm run release:verify:ci --
          --suite windows-installer
          --version "${{ needs.prepare.outputs.version }}"
          --head-sha "${{ needs.prepare.outputs.head_sha }}"
          --candidate-manifest "$env:RUNNER_TEMP/windows-final/evidence/candidate.json"
          --release-dir "$env:RUNNER_TEMP/windows-final/artifacts"
          --subject-file "$env:RUNNER_TEMP/windows-final/artifacts/Flowzero-${{ needs.prepare.outputs.version }}-Setup.exe"
          --output "$env:RUNNER_TEMP/windows-verification/verification.json"
        env:
          WINDOWS_CERT_FILE: ${{ needs.prepare.outputs.windows_signing_policy == 'authenticode' && format('{0}\flowzero-verification-signing.pfx', runner.temp) || '' }}
          WINDOWS_CERT_PASSWORD: ${{ needs.prepare.outputs.windows_signing_policy == 'authenticode' && secrets.WINDOWS_CERT_PASSWORD || '' }}

      - name: Remove the materialized Windows verification certificate
        if: ${{ always() && needs.prepare.outputs.windows_signing_policy == 'authenticode' }}
        shell: pwsh
        run: Remove-Item -LiteralPath "$env:RUNNER_TEMP\flowzero-verification-signing.pfx" -Force -ErrorAction SilentlyContinue

      - name: Read back the exact held bridge and immutable assets
        if: needs.prepare.outputs.windows_legacy_bridge_required == 'true'
        shell: pwsh
        run: >-
          node release-infra/.github/scripts/materialize-windows-legacy-bridge.mjs
          --target-candidate "$env:RUNNER_TEMP/windows-final/evidence/candidate.json"
          --output-dir "$env:RUNNER_TEMP/trusted-windows-legacy-bridge"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: flowzero-releases

      - name: Prove the exact old to bridge to target journey
        if: needs.prepare.outputs.windows_legacy_bridge_required == 'true'
        shell: pwsh
        run: |
          node -e "const s=require('./package.json').scripts;if(!s?.['release:verify:windows-legacy-bridge:ci'])throw new Error('missing canonical two-hop bridge verifier')"
          pnpm run release:verify:windows-legacy-bridge:ci -- `
            --mode two-hop `
            --target-candidate "$env:RUNNER_TEMP/windows-final/evidence/candidate.json" `
            --target-asset-root "$env:RUNNER_TEMP/windows-final/artifacts" `
            --bridge-hold "$env:RUNNER_TEMP/trusted-windows-legacy-bridge/hold.json" `
            --bridge-candidate "$env:RUNNER_TEMP/trusted-windows-legacy-bridge/candidate.json" `
            --bridge-asset-root "$env:RUNNER_TEMP/trusted-windows-legacy-bridge/assets" `
            --output "$env:RUNNER_TEMP/windows-verification/two-hop-acceptance.json"

      - name: Build the content-addressed compatibility binding
        if: needs.prepare.outputs.windows_legacy_bridge_required == 'true'
        shell: pwsh
        run: |
          node release-infra/.github/scripts/windows-legacy-bridge-contract.mjs build-binding `
            --hold "$env:RUNNER_TEMP/trusted-windows-legacy-bridge/hold.json" `
            --target-candidate "$env:RUNNER_TEMP/windows-final/evidence/candidate.json" `
            --acceptance "$env:RUNNER_TEMP/windows-verification/two-hop-acceptance.json" `
            --output "$env:RUNNER_TEMP/windows-verification/compatibility-binding.json"
          Copy-Item `
            "$env:RUNNER_TEMP/trusted-windows-legacy-bridge/hold.json" `
            "$env:RUNNER_TEMP/windows-verification/bridge-hold.json"

      - name: Upload Windows acceptance receipt
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-verification-${{ needs.prepare.outputs.transaction_short }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-verification
          if-no-files-found: error
          retention-days: 30

  mirror-macos:
    if: needs.prepare.outputs.is_owner == 'true' && needs.prepare.outputs.macos_requested == 'true'
    needs: [prepare, finalize-macos, accept-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      state_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      final_artifact_id: ${{ needs.finalize-macos.outputs.final_artifact_id }}
      verification_artifact_id: ${{ needs.accept-macos.outputs.verification_artifact_id }}
    steps:
      - name: Checkout frozen release infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.release_infra_sha }}
          persist-credentials: false

      - name: Download exact final Mac candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.finalize-macos.outputs.final_artifact_id }}
          path: ${{ runner.temp }}/mac-final

      - name: Download exact Mac acceptance receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.accept-macos.outputs.verification_artifact_id }}
          path: ${{ runner.temp }}/mac-verification

      - name: Freeze build checkpoint
        run: >-
          node .github/scripts/release-platform-checkpoint.mjs
          --phase build_created
          --candidate "$RUNNER_TEMP/mac-final/evidence/candidate.json"
          --transaction "$RUNNER_TEMP/mac-final/evidence/release-transaction.json"
          --output "$RUNNER_TEMP/mac-state/build-created.json"

      - name: Freeze business acceptance checkpoint
        run: >-
          node .github/scripts/release-platform-checkpoint.mjs
          --phase platform_verified
          --candidate "$RUNNER_TEMP/mac-final/evidence/candidate.json"
          --transaction "$RUNNER_TEMP/mac-final/evidence/release-transaction.json"
          --parent "$RUNNER_TEMP/mac-state/build-created.json"
          --verification "$RUNNER_TEMP/mac-verification/verification.json"
          --verification "$RUNNER_TEMP/mac-verification/live-stepfun-timeline.json"
          --output "$RUNNER_TEMP/mac-state/platform-verified.json"

      - name: Reject a Mac downgrade before immutable mirror writes
        run: >-
          node .github/scripts/assert-platform-release-forward.mjs
          --channel "${{ needs.prepare.outputs.channel }}"
          --platform macos-arm64
          --target-tag "${{ needs.prepare.outputs.tag }}"
          --allow-downgrade false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: flowzero-releases

      - name: Mirror exact Mac candidate once
        uses: ./.github/actions/mirror-release-assets
        with:
          candidate-manifest: ${{ runner.temp }}/mac-final/evidence/candidate.json
          asset-root: ${{ runner.temp }}/mac-final/artifacts
          output-receipt: ${{ runner.temp }}/mac-state/mirror-receipt.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: flowzero-releases
          R2_PUBLIC_BASE_URL: https://downloads.flowzero.app
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_ENDPOINT: https://oss-cn-beijing.aliyuncs.com
          ALIYUN_OSS_REGION: cn-beijing
          ALIYUN_OSS_BUCKET: flowzero-releases-cn
          ALIYUN_OSS_PUBLIC_BASE_URL: https://flowzero-releases-cn.oss-cn-beijing.aliyuncs.com

      - name: Freeze mirrored checkpoint
        run: >-
          node .github/scripts/release-platform-checkpoint.mjs
          --phase mirrored
          --candidate "$RUNNER_TEMP/mac-final/evidence/candidate.json"
          --transaction "$RUNNER_TEMP/mac-final/evidence/release-transaction.json"
          --parent "$RUNNER_TEMP/mac-state/platform-verified.json"
          --verification "$RUNNER_TEMP/mac-verification/verification.json"
          --verification "$RUNNER_TEMP/mac-verification/live-stepfun-timeline.json"
          --mirror-receipt "$RUNNER_TEMP/mac-state/mirror-receipt.json"
          --output "$RUNNER_TEMP/mac-state/mirrored.json"

      - name: Generate Mac platform snapshot
        run: >-
          node .github/scripts/generate-platform-channel-manifest.mjs
          --checkpoint "$RUNNER_TEMP/mac-state/mirrored.json"
          --output "$RUNNER_TEMP/mac-state/platform-manifest.json"

      - name: Upload durable Mac state checkpoint
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-state-${{ needs.prepare.outputs.transaction_short }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mac-state
          if-no-files-found: error
          retention-days: 30

  mirror-windows:
    if: needs.prepare.outputs.is_owner == 'true' && needs.prepare.outputs.windows_requested == 'true'
    needs: [prepare, build-windows, accept-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      state_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      final_artifact_id: ${{ needs.build-windows.outputs.final_artifact_id }}
      verification_artifact_id: ${{ needs.accept-windows.outputs.verification_artifact_id }}
    steps:
      - name: Checkout frozen release infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.release_infra_sha }}
          persist-credentials: false

      - name: Download exact final Windows candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build-windows.outputs.final_artifact_id }}
          path: ${{ runner.temp }}/windows-final

      - name: Download exact Windows acceptance receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.accept-windows.outputs.verification_artifact_id }}
          path: ${{ runner.temp }}/windows-verification

      - name: Download immutable release transaction
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.transaction_artifact_id }}
          path: ${{ runner.temp }}/windows-transaction

      - name: Fail closed on a declared Windows legacy bridge requirement
        run: |
          set -euo pipefail
          bridge_args=()
          if [[ -f "$RUNNER_TEMP/windows-verification/compatibility-binding.json" || -f "$RUNNER_TEMP/windows-verification/bridge-hold.json" ]]; then
            test -f "$RUNNER_TEMP/windows-verification/compatibility-binding.json"
            test -f "$RUNNER_TEMP/windows-verification/bridge-hold.json"
            bridge_args+=(
              --binding "$RUNNER_TEMP/windows-verification/compatibility-binding.json"
              --hold "$RUNNER_TEMP/windows-verification/bridge-hold.json"
            )
          fi
          node .github/scripts/validate-windows-legacy-bridge-promotion.mjs \
            --candidate "$RUNNER_TEMP/windows-final/evidence/candidate.json" \
            "${bridge_args[@]}"

      - name: Freeze Windows build checkpoint
        run: >-
          node .github/scripts/release-platform-checkpoint.mjs
          --phase build_created
          --candidate "$RUNNER_TEMP/windows-final/evidence/candidate.json"
          --transaction "$RUNNER_TEMP/windows-transaction/release-transaction.json"
          --output "$RUNNER_TEMP/windows-state/build-created.json"

      - name: Freeze Windows acceptance checkpoint
        run: >-
          node .github/scripts/release-platform-checkpoint.mjs
          --phase platform_verified
          --candidate "$RUNNER_TEMP/windows-final/evidence/candidate.json"
          --transaction "$RUNNER_TEMP/windows-transaction/release-transaction.json"
          --parent "$RUNNER_TEMP/windows-state/build-created.json"
          --verification "$RUNNER_TEMP/windows-verification/verification.json"
          --output "$RUNNER_TEMP/windows-state/platform-verified.json"

      - name: Reject a Windows downgrade before immutable mirror writes
        run: >-
          node .github/scripts/assert-platform-release-forward.mjs
          --channel "${{ needs.prepare.outputs.channel }}"
          --platform windows-x64
          --target-tag "${{ needs.prepare.outputs.tag }}"
          --allow-downgrade false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: flowzero-releases

      - name: Mirror exact Windows candidate once
        uses: ./.github/actions/mirror-release-assets
        with:
          candidate-manifest: ${{ runner.temp }}/windows-final/evidence/candidate.json
          asset-root: ${{ runner.temp }}/windows-final/artifacts
          output-receipt: ${{ runner.temp }}/windows-state/mirror-receipt.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: flowzero-releases
          R2_PUBLIC_BASE_URL: https://downloads.flowzero.app
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_ENDPOINT: https://oss-cn-beijing.aliyuncs.com
          ALIYUN_OSS_REGION: cn-beijing
          ALIYUN_OSS_BUCKET: flowzero-releases-cn
          ALIYUN_OSS_PUBLIC_BASE_URL: https://flowzero-releases-cn.oss-cn-beijing.aliyuncs.com

      - name: Freeze Windows mirrored checkpoint
        run: |
          set -euo pipefail
          bridge_args=()
          if [[ -f "$RUNNER_TEMP/windows-verification/compatibility-binding.json" ]]; then
            bridge_args+=(
              --legacy-bridge-binding "$RUNNER_TEMP/windows-verification/compatibility-binding.json"
              --legacy-bridge-hold "$RUNNER_TEMP/windows-verification/bridge-hold.json"
            )
          fi
          node .github/scripts/release-platform-checkpoint.mjs \
            --phase mirrored \
            --candidate "$RUNNER_TEMP/windows-final/evidence/candidate.json" \
            --transaction "$RUNNER_TEMP/windows-transaction/release-transaction.json" \
            --parent "$RUNNER_TEMP/windows-state/platform-verified.json" \
            --verification "$RUNNER_TEMP/windows-verification/verification.json" \
            --mirror-receipt "$RUNNER_TEMP/windows-state/mirror-receipt.json" \
            "${bridge_args[@]}" \
            --output "$RUNNER_TEMP/windows-state/mirrored.json"

      - name: Generate Windows platform snapshot
        run: >-
          node .github/scripts/generate-platform-channel-manifest.mjs
          --checkpoint "$RUNNER_TEMP/windows-state/mirrored.json"
          --output "$RUNNER_TEMP/windows-state/platform-manifest.json"

      - name: Preserve validated Windows legacy bridge evidence when required
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/windows-verification/compatibility-binding.json" ]]; then
            cp "$RUNNER_TEMP/windows-verification/compatibility-binding.json" "$RUNNER_TEMP/windows-state/compatibility-binding.json"
            cp "$RUNNER_TEMP/windows-verification/bridge-hold.json" "$RUNNER_TEMP/windows-state/bridge-hold.json"
          fi

      - name: Upload durable Windows state checkpoint
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-state-${{ needs.prepare.outputs.transaction_short }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-state
          if-no-files-found: error
          retention-days: 30

  promote-macos:
    if: needs.prepare.outputs.is_owner == 'true' && needs.prepare.outputs.macos_requested == 'true'
    needs: [prepare, mirror-macos]
    runs-on: ubuntu-24.04
    environment: ${{ needs.prepare.outputs.channel }}-release
    concurrency:
      group: flowzero-promote-${{ needs.prepare.outputs.channel }}-macos-arm64
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout frozen release infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.release_infra_sha }}
          persist-credentials: false

      - name: Download Mac mirrored checkpoint
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.mirror-macos.outputs.state_artifact_id }}
          path: ${{ runner.temp }}/mac-state

      - name: Promote Mac independently
        uses: ./.github/actions/promote-update-channel
        with:
          platform-manifest: ${{ runner.temp }}/mac-state/platform-manifest.json
          mirrored-checkpoint: ${{ runner.temp }}/mac-state/mirrored.json
          allow-downgrade: 'false'
          output-receipt: ${{ runner.temp }}/mac-promotion.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: flowzero-releases
          R2_PUBLIC_BASE_URL: https://downloads.flowzero.app
          ALIYUN_OSS_PUBLIC_BASE_URL: https://flowzero-releases-cn.oss-cn-beijing.aliyuncs.com

      - name: Preserve Mac promotion receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-promotion-${{ needs.prepare.outputs.transaction_short }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mac-promotion.json
          if-no-files-found: error
          retention-days: 30

  promote-windows:
    if: needs.prepare.outputs.is_owner == 'true' && needs.prepare.outputs.windows_requested == 'true'
    needs: [prepare, mirror-windows]
    runs-on: ubuntu-24.04
    environment: ${{ needs.prepare.outputs.channel }}-release
    concurrency:
      group: flowzero-promote-${{ needs.prepare.outputs.channel }}-windows-x64
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout frozen release infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.release_infra_sha }}
          persist-credentials: false

      - name: Download Windows mirrored checkpoint
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.mirror-windows.outputs.state_artifact_id }}
          path: ${{ runner.temp }}/windows-state

      - name: Promote Windows independently
        uses: ./.github/actions/promote-update-channel
        with:
          platform-manifest: ${{ runner.temp }}/windows-state/platform-manifest.json
          mirrored-checkpoint: ${{ runner.temp }}/windows-state/mirrored.json
          allow-downgrade: 'false'
          output-receipt: ${{ runner.temp }}/windows-promotion.json
          compatibility-binding: ${{ runner.temp }}/windows-state/compatibility-binding.json
          bridge-hold: ${{ runner.temp }}/windows-state/bridge-hold.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: flowzero-releases
          R2_PUBLIC_BASE_URL: https://downloads.flowzero.app
          ALIYUN_OSS_PUBLIC_BASE_URL: https://flowzero-releases-cn.oss-cn-beijing.aliyuncs.com

      - name: Preserve Windows promotion receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-promotion-${{ needs.prepare.outputs.transaction_short }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-promotion.json
          if-no-files-found: error
          retention-days: 30

  canary-macos:
    if: needs.prepare.outputs.is_owner == 'true' && needs.prepare.outputs.macos_requested == 'true'
    needs: [prepare, promote-macos]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout frozen release infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.release_infra_sha }}
          persist-credentials: false

      - name: Verify user-facing Mac update channel and one-byte transport
        run: >-
          node .github/scripts/verify-channel-canary.mjs
          --channel "${{ needs.prepare.outputs.channel }}"
          --platform macos-arm64
          --version "${{ needs.prepare.outputs.version }}"

  canary-windows:
    if: needs.prepare.outputs.is_owner == 'true' && needs.prepare.outputs.windows_requested == 'true'
    needs: [prepare, promote-windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout frozen release infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.release_infra_sha }}
          persist-credentials: false

      - name: Verify user-facing Windows update channel and one-byte transport
        run: >-
          node .github/scripts/verify-channel-canary.mjs
          --channel "${{ needs.prepare.outputs.channel }}"
          --platform windows-x64
          --version "${{ needs.prepare.outputs.version }}"

  archive-release:
    if: >-
      always()
      && needs.prepare.result == 'success'
      && needs.prepare.outputs.is_owner == 'true'
      && (needs.prepare.outputs.macos_requested != 'true' || needs.canary-macos.result == 'success')
      && (needs.prepare.outputs.windows_requested != 'true' || needs.canary-windows.result == 'success')
    needs: [prepare, mirror-macos, mirror-windows, canary-macos, canary-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Checkout frozen release infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.release_infra_sha }}
          persist-credentials: false

      - name: Download immutable transaction
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.transaction_artifact_id }}
          path: ${{ runner.temp }}/archive-input/transaction

      - name: Download final Mac candidate
        if: needs.prepare.outputs.macos_requested == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.mirror-macos.outputs.final_artifact_id }}
          path: ${{ runner.temp }}/archive-input/macos-arm64/final

      - name: Download Mac verification
        if: needs.prepare.outputs.macos_requested == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.mirror-macos.outputs.verification_artifact_id }}
          path: ${{ runner.temp }}/archive-input/macos-arm64/verification

      - name: Download final Windows candidate
        if: needs.prepare.outputs.windows_requested == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.mirror-windows.outputs.final_artifact_id }}
          path: ${{ runner.temp }}/archive-input/windows-x64/final

      - name: Download Windows verification
        if: needs.prepare.outputs.windows_requested == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.mirror-windows.outputs.verification_artifact_id }}
          path: ${{ runner.temp }}/archive-input/windows-x64/verification

      - name: Assemble exact archive manifest and asset set
        run: >-
          node .github/scripts/assemble-release-archive.mjs
          --transaction "$RUNNER_TEMP/archive-input/transaction/release-transaction.json"
          --input-root "$RUNNER_TEMP/archive-input"
          --output-root "$RUNNER_TEMP/archive-assets"

      - name: Create or resume immutable GitHub archive
        run: >-
          node .github/scripts/archive-release.mjs
          --manifest "$RUNNER_TEMP/archive-assets/release-manifest.json"
          --asset-root "$RUNNER_TEMP/archive-assets"
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ADMIN_TOKEN: ${{ secrets.FLOWZERO_REPO_TOKEN }}
